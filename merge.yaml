# Profile Enhancement Merge Template for Clash Verge
#
# 1. 机场订阅只负责提供节点，不依赖机场自带策略组和规则
# 2. 所有自定义策略组均使用固定名称，切换不同订阅无需修改 rules
# 3. 基础规则使用 Loyalsoldier https://github.com/Loyalsoldier/clash-rules
# 4. 细分服务规则使用 blackmatrix7 / ios_rule_script https://github.com/blackmatrix7/ios_rule_script
# 5. SteamCN、局域网、中国 IP 等优先直连
# 6. AI / 流媒体等需要地区选择的服务保留独立策略组
#
# blackmatrix7 的 Clash 规则采用 classical 格式。
# OpenAI、Claude、Gemini、Copilot、SteamCN 等路径均来自其公开规则项目。
# SteamCN 独立 DIRECT，可避免 Steam 中国 CDN 被国外代理接管。
#
# 注意：
# - 本配置故意不依赖机场的「手动选择」「节点选择」「全球代理」等分组。
# - include-all 会直接收集订阅中的实际节点 / provider 节点。
# - 如果某些机场把「剩余流量 / 到期时间」伪装成节点，exclude-filter 会尽量排除。
# - tld-not-cn 保留 provider，但默认不启用，因为匹配范围过宽，容易造成不必要代理。

profile:
  store-selected: true

dns:
  use-system-hosts: false


# ============================================================
# 策略组
# ============================================================

proxy-groups:

  # ----------------------------------------------------------
  # 基础节点选择
  # ----------------------------------------------------------

  - name: "🚀 默认代理"
    type: select
    proxies:
      - "♻️ 自动选择"
      - "🎯 全部节点"
      - "🇭🇰 香港"
      - "🇹🇼 台湾"
      - "🇯🇵 日本"
      - "🇸🇬 新加坡"
      - "🇺🇸 美国"
      - "🌍 其他地区"
      - DIRECT

  - name: "♻️ 自动选择"
    type: url-test
    include-all: true
    exclude-filter: "(?i)(剩余|流量|套餐|到期|过期|官网|客服|邮箱|traffic|expire|quota|剩余流量)"
    url: "https://www.gstatic.com/generate_204"
    interval: 300
    tolerance: 50
    lazy: true

  - name: "🎯 全部节点"
    type: select
    include-all: true
    exclude-filter: "(?i)(剩余|流量|套餐|到期|过期|官网|客服|邮箱|traffic|expire|quota|剩余流量)"

  # ----------------------------------------------------------
  # 地区节点
  # ----------------------------------------------------------

  - name: "🇭🇰 香港"
    type: select
    include-all: true
    filter: "(?i)(香港|港|Hong.?Kong|\\bHK\\b|HKT|HKBN)"
    exclude-filter: "(?i)(剩余|流量|套餐|到期|过期|官网|客服|邮箱|traffic|expire|quota)"

  - name: "🇹🇼 台湾"
    type: select
    include-all: true
    filter: "(?i)(台湾|台灣|Taiwan|Taipei|台北|\\bTW\\b)"
    exclude-filter: "(?i)(剩余|流量|套餐|到期|过期|官网|客服|邮箱|traffic|expire|quota)"

  - name: "🇯🇵 日本"
    type: select
    include-all: true
    filter: "(?i)(日本|东京|東京|大阪|Japan|Tokyo|Osaka|\\bJP\\b)"
    exclude-filter: "(?i)(剩余|流量|套餐|到期|过期|官网|客服|邮箱|traffic|expire|quota)"

  - name: "🇸🇬 新加坡"
    type: select
    include-all: true
    filter: "(?i)(新加坡|狮城|Singapore|\\bSG\\b)"
    exclude-filter: "(?i)(剩余|流量|套餐|到期|过期|官网|客服|邮箱|traffic|expire|quota)"

  - name: "🇺🇸 美国"
    type: select
    include-all: true
    filter: "(?i)(美国|美國|United.?States|America|洛杉矶|洛杉磯|纽约|紐約|西雅图|西雅圖|芝加哥|硅谷|矽谷|盐湖城|鹽湖城|佛罗里达|佛羅里達|Dallas|Seattle|Chicago|New.?York|Los.?Angeles|San.?Jose|\\bUSA?\\b)"
    exclude-filter: "(?i)(剩余|流量|套餐|到期|过期|官网|客服|邮箱|traffic|expire|quota)"

  - name: "🌍 其他地区"
    type: select
    include-all: true
    exclude-filter: "(?i)(香港|港|Hong.?Kong|\\bHK\\b|HKT|台湾|台灣|Taiwan|Taipei|\\bTW\\b|日本|东京|東京|大阪|Japan|Tokyo|Osaka|\\bJP\\b|新加坡|Singapore|\\bSG\\b|美国|美國|United.?States|America|洛杉矶|洛杉磯|纽约|紐約|西雅图|西雅圖|芝加哥|硅谷|矽谷|盐湖城|鹽湖城|佛罗里达|佛羅里達|Dallas|Seattle|Chicago|New.?York|Los.?Angeles|San.?Jose|\\bUSA?\\b|剩余|流量|套餐|到期|过期|官网|客服|邮箱|traffic|expire|quota)"


