# ============================================================
# Rules
#
# Mihomo / Clash 按从上到下顺序匹配。
# 越具体的服务越靠前，基础代理 / 国内规则越靠后。
# ============================================================

rules:

  # ----------------------------------------------------------
  # 本机 / 局域网
  # ----------------------------------------------------------

  - RULE-SET,applications,DIRECT
  - RULE-SET,private,DIRECT
  - RULE-SET,lancidr,DIRECT,no-resolve

  - DOMAIN,clash.razord.top,DIRECT
  - DOMAIN,yacd.haishan.me,DIRECT


  # ----------------------------------------------------------
  # 自定义规则
  # ----------------------------------------------------------
  - DOMAIN-SUFFIX,linuxdo.org,DIRECT
  - DOMAIN-SUFFIX,linux.do,🚀 默认代理


  # ----------------------------------------------------------
  # 广告 / 拒绝
  # ----------------------------------------------------------

  - RULE-SET,reject,REJECT


  # ----------------------------------------------------------
  # Steam 中国区 / CDN
  #
  # 必须在 Steam 国际规则之前。
  # ----------------------------------------------------------

  - RULE-SET,SteamCN,DIRECT

  - DOMAIN-SUFFIX,cm.steampowered.com,DIRECT
  - DOMAIN-SUFFIX,steamcontent.com,DIRECT
  - DOMAIN-SUFFIX,steamserver.net,DIRECT


  # ----------------------------------------------------------
  # AI
  #
  # 必须早于 Google / Microsoft 等大范围规则。
  # ----------------------------------------------------------

  - RULE-SET,OpenAI,🤖 OpenAI
  - RULE-SET,Claude,🧠 Claude
  - RULE-SET,Gemini,✨ Gemini
  - RULE-SET,Copilot,🪟 Copilot

  # 一些暂时没有单独 provider 的 AI 服务
  - DOMAIN-SUFFIX,poe.com,🤖 其他 AI
  - DOMAIN-SUFFIX,perplexity.ai,🤖 其他 AI
  - DOMAIN-SUFFIX,perplexity.com,🤖 其他 AI
  - DOMAIN-SUFFIX,character.ai,🤖 其他 AI
  - DOMAIN-SUFFIX,jetbrains.ai,🤖 其他 AI
  - DOMAIN-SUFFIX,cursor.com,🤖 其他 AI


  # ----------------------------------------------------------
  # 视频 / 流媒体
  #
  # YouTube 必须早于 Google。
  # ----------------------------------------------------------

  - RULE-SET,YouTube,📺 YouTube
  - RULE-SET,Netflix,🎬 Netflix
  - RULE-SET,Disney,🏰 Disney+
  - RULE-SET,HBO,🎞️ Max
  - RULE-SET,PrimeVideo,📦 Prime Video
  - RULE-SET,TikTok,📱 TikTok
  - RULE-SET,Bahamut,🐉 Bahamut
  - RULE-SET,Bilibili,📺 Bilibili


  # ----------------------------------------------------------
  # 通讯 / 社交
  # ----------------------------------------------------------

  - RULE-SET,Telegram,✈️ Telegram
  - RULE-SET,telegramcidr,✈️ Telegram,no-resolve
  - RULE-SET,Twitter,🐦 Twitter
  - RULE-SET,WhatsApp,💬 WhatsApp


  # ----------------------------------------------------------
  # 游戏平台
  # ----------------------------------------------------------

  - RULE-SET,Steam,🎮 游戏平台
  - RULE-SET,Blizzard,🎮 游戏平台
  - RULE-SET,EA,🎮 游戏平台
  - RULE-SET,Epic,🎮 游戏平台
  - RULE-SET,Nintendo,🎮 游戏平台
  - RULE-SET,Xbox,🎮 游戏平台
  - RULE-SET,PlayStation,🎮 游戏平台
  - RULE-SET,Riot,🎮 游戏平台
  - RULE-SET,Rockstar,🎮 游戏平台
  - RULE-SET,HoYoverse,🎮 游戏平台
  - RULE-SET,GOG,🎮 游戏平台


  # ----------------------------------------------------------
  # 大型互联网服务
  #
  # AI / YouTube / Copilot 已经在前面优先匹配。
  # ----------------------------------------------------------

  - RULE-SET,GitHub,🐙 GitHub
  - RULE-SET,google,🔎 Google
  - RULE-SET,Microsoft,Ⓜ️ Microsoft

  - RULE-SET,apple,🍎 Apple

  # icloud 已被 apple 包含
  # - RULE-SET,icloud,🍎 Apple

  - RULE-SET,apple-cn-direct,DIRECT
  - RULE-SET,google-cn-direct,DIRECT


  # ----------------------------------------------------------
  # 明确代理
  # ----------------------------------------------------------

  - RULE-SET,gfw,🚀 默认代理
  - RULE-SET,proxy,🚀 默认代理

  # tld-not-cn 范围非常宽，默认关闭。
  # 如希望所有非 CN TLD 都代理，可取消下一行注释。
  # - RULE-SET,tld-not-cn,🚀 默认代理


  # ----------------------------------------------------------
  # 明确直连
  # ----------------------------------------------------------

  - RULE-SET,direct,DIRECT


  # ----------------------------------------------------------
  # 中国 IP
  # ----------------------------------------------------------

  - RULE-SET,cncidr,DIRECT,no-resolve


  # ----------------------------------------------------------
  # GEOIP 兜底
  # ----------------------------------------------------------

  - GEOIP,LAN,DIRECT,no-resolve
  - GEOIP,CN,DIRECT,no-resolve


  # ----------------------------------------------------------
  # 最终兜底
  # ----------------------------------------------------------

  - MATCH,🐟 漏网之鱼